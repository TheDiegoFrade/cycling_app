<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Torq · Inicio</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:ital,wght@0,300..800;1,300..800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0D1A}
a{color:#F2F4FA}a:hover{color:#FF8A4C}
button{font-family:inherit;cursor:pointer}
.tk{display:block;background-position:center;background-size:contain;background-repeat:no-repeat;filter:drop-shadow(0 10px 12px rgba(0,0,0,.55));transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.lift:hover .tk,.lift:focus-visible .tk{transform:translateY(-6px) rotate(-5deg) scale(1.08)}
.lift{transition:background-color .2s, box-shadow .2s}
.lift:hover{background-color:#1A1F38 !important}
.bob{animation:bob 4.5s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-9px) rotate(2deg)}}
.drift{animation:drift 22s ease-in-out infinite alternate}
@keyframes drift{from{transform:scale(1.06) translateX(1.5%)}to{transform:scale(1) translateX(0)}}
@media (prefers-reduced-motion: reduce){.bob,.drift{animation:none}.tk,.lift{transition:none}}
</style>
</helmet>
<div style="min-height: 900px; background: #0B0D1A; color: #F2F4FA; font-family: 'Host Grotesk', 'Helvetica Neue', sans-serif; display: flex; flex-wrap: wrap; align-items: stretch">
  <dc-import name="Sidebar" active="inicio" hint-size="248px,900px"></dc-import>

  <main style="flex: 999 1 560px; min-width: 0; padding: 28px clamp(16px, 3vw, 40px) 40px; box-sizing: border-box">
    <div style="max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px">

      <sc-if value="{{recovery}}" hint-placeholder-val="{{ false }}">
        <div role="status" style="display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 14px 18px; border-radius: 16px; background: #241D12">
          <span style="font-size: 15px">Se cortó un entrenamiento sin guardar (24 min).</span>
          <div style="display: flex; gap: 8px; flex-wrap: wrap">
            <button type="button" style="min-height: 40px; padding: 0 16px; border-radius: 999px; border: 0; background: #FF6A1F; color: #0B0D1A; font-weight: 600; font-size: 14px">Continuar</button>
            <button type="button" style="min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid #3A4266; background: transparent; color: #F2F4FA; font-size: 14px">Guardar como sesión</button>
            <button type="button" style="min-height: 40px; padding: 0 16px; border-radius: 999px; border: 0; background: transparent; color: #A9B1CC; font-size: 14px">Descartar</button>
          </div>
        </div>
      </sc-if>

      <!-- Hoy toca: la escena ilustrada -->
      <section aria-label="Hoy toca" style="position: relative; height: 540px; border-radius: 28px; overflow: hidden; background: #0B0D1A">
        <img class="drift" src="/_blob/2d7bacf49b2e427b53e401e19b0f387c" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 68% 50%">
        <div aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(90deg, rgba(11,13,26,0.92) 0%, rgba(11,13,26,0.7) 34%, rgba(11,13,26,0) 62%)"></div>
        <div style="position: absolute; left: 0; top: 0; bottom: 0; width: min(500px, 100%); padding: 34px 36px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px">
          <span style="font-size: 15px; color: #C9D3F5">Buenas noches, Diego · hoy toca</span>
          <div style="display: flex; align-items: flex-end; gap: 14px">
            <h1 style="margin: 0; font-weight: 600; font-size: clamp(60px, 7vw, 104px); line-height: 0.86; letter-spacing: -0.055em">Endurance</h1>
            <span aria-hidden="true" class="tk bob" style="flex: none; width: 76px; height: 76px; margin-bottom: 4px; background-image: url(/_blob/8cdaf45c0a131a708795625d5eb2a17f)"></span>
          </div>
          <span style="font-size: 19px; color: #C9D3F5">65 min · 74–86 W · Z2</span>
          <div style="margin-top: auto; display: flex; flex-direction: column; gap: 14px; align-items: flex-start">
            <a href="{{cta.href}}" style="display: inline-flex; align-items: center; gap: 12px; min-height: 68px; padding: 0 34px; border-radius: 999px; background: #FF6A1F; color: #0B0D1A; text-decoration: none; font-weight: 700; font-size: 21px; letter-spacing: -0.02em; box-shadow: 0 10px 40px rgba(255,106,31,0.35)">
              <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24"><path d="M6 4v16l14-8z" fill="#0B0D1A"></path></svg><span>{{cta.label}}</span>
            </a>
            <span style="font-size: 14px; color: #A9B1CC">{{cta.hint}}</span>
          </div>
        </div>
      </section>

      <!-- Esta semana, en fichas -->
      <section aria-label="Esta semana" style="display: flex; align-items: center; gap: 18px; flex-wrap: wrap">
        <a href="Plan.dc.html" style="display: flex; flex-direction: column; gap: 2px; text-decoration: none; min-width: 150px">
          <span style="font-size: 14px; color: #A9B1CC">Esta semana</span>
          <span style="font-weight: 600; font-size: 22px; letter-spacing: -0.02em">1 de 5 · 38 TSS</span>
          <span style="font-size: 13px; color: #FF8A4C">ver plan →</span>
        </a>
        <div style="flex: 1 1 520px; min-width: 0; overflow-x: auto">
          <div style="display: grid; grid-template-columns: repeat(7, minmax(72px, 1fr)); gap: 8px; min-width: 520px">
            <sc-for list="{{week}}" as="d" hint-placeholder-count="7">
              <a href="Plan.dc.html" class="lift" aria-label="{{d.aria}}" style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 6px 10px; border-radius: 16px; background: #11152A; box-shadow: {{d.ring}}; text-decoration: none; color: #F2F4FA">
                <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; color: {{d.labelColor}}">{{d.label}}</span>
                <span aria-hidden="true" class="tk" style="width: 46px; height: 46px; background-image: {{d.img}}; opacity: {{d.op}}"></span>
                <span aria-hidden="true" style="position: absolute; top: 8px; right: 8px; width: 16px; height: 16px; border-radius: 50%; background: #3FE08A; display: {{d.check}}; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#0B0D1A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></span>
              </a>
            </sc-for>
          </div>
        </div>
      </section>

      <div style="display: flex; justify-content: flex-end">
        <button type="button" onClick="{{toggleGen}}" aria-expanded="{{genOpenStr}}" style="min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid #2A3150; background: transparent; color: #F2F4FA; font-size: 15px">{{genLabel}}</button>
      </div>

      <sc-if value="{{genOpen}}" hint-placeholder-val="{{ false }}">
        <section aria-label="Generar workout" style="padding: 22px; border-radius: 24px; background: #141829; display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-end">
          <div role="radiogroup" aria-label="Tipo" style="flex: 1 1 100%; display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px">
            <sc-for list="{{chips}}" as="c" hint-placeholder-count="5">
              <button type="button" role="radio" class="lift" aria-checked="{{c.checked}}" onClick="{{c.pick}}" style="min-height: 112px; padding: 12px 10px; border-radius: 18px; border: 1.5px solid {{c.border}}; background: {{c.bg}}; color: #F2F4FA; font-size: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px">
                <span aria-hidden="true" class="tk" style="width: 54px; height: 54px; background-image: {{c.img}}"></span>{{c.label}}
              </button>
            </sc-for>
          </div>
          <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #A9B1CC">Minutos<input type="number" value="45" style="width: 96px; min-height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 12px; border: 1px solid #2A3150; background: #0B0D1A; color: #F2F4FA; font-family: inherit; font-size: 18px; font-weight: 600"></label>
          <div role="radiogroup" aria-label="Cuándo" style="display: flex; padding: 4px; gap: 4px; border-radius: 12px; border: 1px solid #2A3150">
            <button type="button" role="radio" aria-checked="true" style="min-height: 36px; padding: 0 12px; border-radius: 9px; border: 0; background: #F2F4FA; color: #0B0D1A; font-weight: 600; font-size: 13px">Ahora mismo</button>
            <button type="button" role="radio" aria-checked="false" style="min-height: 36px; padding: 0 12px; border-radius: 9px; border: 0; background: transparent; color: #A9B1CC; font-size: 13px">Otra fecha</button>
          </div>
          <a href="Preparar.dc.html" style="margin-left: auto; display: inline-flex; align-items: center; min-height: 48px; padding: 0 22px; border-radius: 999px; background: #F2F4FA; color: #0B0D1A; text-decoration: none; font-weight: 600; font-size: 15px">Generar y entrenar</a>
        </section>
      </sc-if>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"conectado":{"editor":"boolean","default":false},"recuperacion":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { chip: 'z2', gen: false }; }
  renderVals() {
    const T = {
      end: 'url(/_blob/8cdaf45c0a131a708795625d5eb2a17f)', ss: 'url(/_blob/4a39691785bd530ad1a80dee35d911f0)',
      ftp: 'url(/_blob/f5e1bb068fffae6ed39225391bd64edc)', vo2: 'url(/_blob/7979febf3ce233c85ea9e1dde580903d)',
      rec: 'url(/_blob/97c5ab1bf9039846a23e32be3943a7a1)', moon: 'url(/_blob/34634d9dd5f1c08358508c44e182d71b)',
      fuerza: "url('data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%22-4 -4 32 32%22 fill=%22none%22 stroke=%22%23F2F4FA%22 stroke-width=%222.4%22 stroke-linecap=%22round%22%3E%3Cpath d=%22M7 8v8M4 10v4M17 8v8M20 10v4M7 12h10%22/%3E%3C/svg%3E'), radial-gradient(circle closest-side at 50% 50%, #626B99 0%, #2A3150 70%, #1A1F38 94%, rgba(0,0,0,0) 100%)"
    };
    const defs = [
      { id: 'z2', label: 'Z2 aeróbico', img: T.end },
      { id: 'rec', label: 'Recuperación', img: T.rec },
      { id: 'ss', label: 'Sweet spot', img: T.ss },
      { id: 'ftp', label: 'Umbral (FTP)', img: T.ftp },
      { id: 'vo2', label: 'VO2max', img: T.vo2 }
    ];
    const chips = defs.map(c => ({ ...c, checked: c.id === this.state.chip ? 'true' : 'false', bg: c.id === this.state.chip ? '#1C2240' : '#10142A', border: c.id === this.state.chip ? '#FF6A1F' : '#232A45', pick: () => this.setState({ chip: c.id }) }));
    const W = [
      ['LUN', 'end', 'done', 'Endurance, hecho'], ['HOY', 'end', 'today', 'Hoy, Endurance'], ['MIÉ', 'fuerza', 'plan', 'Fuerza y movilidad'],
      ['JUE', 'ss', 'plan', 'Sweet spot'], ['VIE', 'moon', 'rest', 'Descanso'], ['SÁB', 'end', 'plan', 'Larga Z2'], ['DOM', 'vo2', 'plan', 'VO2max']
    ];
    const week = W.map(([label, k, st, aria]) => ({
      label, aria: label + ': ' + aria, img: T[k],
      labelColor: st === 'today' ? '#FF8A4C' : '#7F88A8',
      ring: st === 'today' ? 'inset 0 0 0 1.5px #FF6A1F' : 'none',
      op: st === 'rest' ? '0.8' : '1',
      check: st === 'done' ? 'flex' : 'none'
    }));
    const on = !!this.props.conectado;
    const g = this.state.gen;
    return {
      chips, week, recovery: !!this.props.recuperacion,
      genOpen: g, genOpenStr: g ? 'true' : 'false', genLabel: g ? 'Cerrar' : '¿Otra cosa? Generar workout',
      toggleGen: () => this.setState({ gen: !g }),
      cta: on ? { label: 'Rodar', href: '#', hint: 'Rodillo y pulso conectados' } : { label: 'Empezar a rodar', href: 'Preparar.dc.html', hint: 'Rodillo sin conectar · se conecta en el siguiente paso' }
    };
  }
}
</script>
</body>
</html>
